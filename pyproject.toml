[tool.poetry]
name = "pamfilico-flask-core"
version = "1.3.0"
description = "Standard response envelope and error classes for Flask APIs"
authors = ["Pamfilico"]
readme = "README.md"
packages = [{include = "pamfilico_flask_core", from = "src"}]

[tool.poetry.dependencies]
python = "^3.9"
flask = ">=2.0.0"
marshmallow = ">=3.0.0"
sqlalchemy = ">=1.4.44"
werkzeug = ">=2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
requests = ">=2.28.0"
psycopg2-binary = ">=2.9.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_integration.py"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
